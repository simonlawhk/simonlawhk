<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>入鋪被痴纏：Sales圍攻版</title>
  <style>
    body {
      margin: 0;
      background-color: #fcefcf;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      background-color: #f8f8f8;
      border: 4px solid #444;
    }
    #scoreBoard {
      font-size: 20px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="scoreBoard">分數：0</div>
  <canvas id="gameCanvas" width="320" height="320"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreBoard = document.getElementById("scoreBoard");

    const tileSize = 32;
    const rows = 10;
    const cols = 10;

    const playerImg = new Image();
    const salesImg = new Image();
    playerImg.src = "pixel_characters.png";
    salesImg.src = "pixel_characters.png";

    const map = Array.from({ length: rows }, () => Array(cols).fill(0));
    const shelves = [
      [3, 3], [3, 4], [3, 5],
      [6, 2], [6, 3], [6, 4],
      [1, 7], [2, 7],
      [8, 6], [8, 7]
    ];
    shelves.forEach(([x, y]) => map[y][x] = 2);

    const player = { x: 0, y: 0 };
    const tail = [];
    const salesList = [];
    let score = 0;

    function drawMap() {
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          ctx.fillStyle = map[y][x] === 2 ? "#999" : "#eee";
          ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
        }
      }
    }

    function drawPlayer() {
      ctx.drawImage(playerImg, 0, 0, 32, 32, player.x * tileSize, player.y * tileSize, tileSize, tileSize);
    }

    function drawTail() {
      for (let seg of tail) {
        ctx.drawImage(salesImg, 32, 0, 32, 32, seg.x * tileSize, seg.y * tileSize, tileSize, tileSize);
      }
    }

    function drawSales() {
      for (let s of salesList) {
        ctx.drawImage(salesImg, 32, 0, 32, 32, s.x * tileSize, s.y * tileSize, tileSize, tileSize);
      }
    }

    function isBlocked(x, y) {
      if (x < 0 || y < 0 || x >= cols || y >= rows) return true;
      if (map[y][x] === 2) return true;
      return false;
    }

    function isTail(x, y) {
      return tail.some(seg => seg.x === x && seg.y === y);
    }

    function isSales(x, y) {
      return salesList.find(s => s.x === x && s.y === y);
    }

    function move(dx, dy) {
      const newX = player.x + dx;
      const newY = player.y + dy;
      if (isBlocked(newX, newY) || isTail(newX, newY)) {
        alert("Game Over! 撞到尾巴或貨架！");
        location.reload();
        return;
      }

      const hitSales = isSales(newX, newY);
      if (hitSales) {
        salesList.splice(salesList.indexOf(hitSales), 1);
        tail.unshift({ x: player.x, y: player.y });
        score++;
        scoreBoard.textContent = `分數：${score}`;
      } else if (tail.length > 0) {
        tail.pop();
        tail.unshift({ x: player.x, y: player.y });
      }

      player.x = newX;
      player.y = newY;
      draw();
    }

    function spawnSales() {
      let empty = [];
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const occupied = map[y][x] === 2 || (x === player.x && y === player.y) || isTail(x, y) || isSales(x, y);
          if (!occupied) empty.push({ x, y });
        }
      }
      if (empty.length > 0) {
        const spot = empty[Math.floor(Math.random() * empty.length)];
        salesList.push(spot);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMap();
      drawSales();
      drawTail();
      drawPlayer();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") move(0, -1);
      if (e.key === "ArrowDown") move(0, 1);
      if (e.key === "ArrowLeft") move(-1, 0);
      if (e.key === "ArrowRight") move(1, 0);
    });

    playerImg.onload = () => {
      draw();
      setInterval(() => {
        spawnSales();
        draw();
      }, 2000);
    };
  </script>
</body>
</html>
